resources:
  pipelines:
    osha_safety:
      name: sentinelops-osha-safety
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      continuous: false
      development: false
      channel: CURRENT
      edition: ADVANCED
      libraries:
        - file:
            path: ../pipelines/osha.py
      configuration:
        sentinelops.catalog: ${var.catalog}
        sentinelops.osha_landing: /Volumes/${var.catalog}/${var.schema}/landing/osha_sir/v1
        # Masking v2 (shortened employer names), then v3 (own-employer fragments next to the mask, a
        # delta of the 17 reports it changes). Each has its own append flow; the latest copy wins in Silver.
        sentinelops.osha_landing_later: /Volumes/${var.catalog}/${var.schema}/landing/osha_sir/v2,/Volumes/${var.catalog}/${var.schema}/landing/osha_sir/v3
        pipelines.maxFlowRetryAttempts: '0'
        pipelines.numUpdateRetryAttempts: '0'
  jobs:
    # Manual only. Lands minimized OSHA reports into Bronze/Silver/Gold.
    osha_ingest:
      name: sentinelops-osha-ingest
      max_concurrent_runs: 1
      timeout_seconds: 900
      performance_target: STANDARD
      tasks:
        - task_key: osha_medallion
          max_retries: 0
          disable_auto_optimization: true
          timeout_seconds: 900
          pipeline_task:
            pipeline_id: ${resources.pipelines.osha_safety.id}
            full_refresh: false
    # Manual only. Incrementally embeds new or changed Gold documents with ai_query
    # (~470 docs/s measured; direct REST calls are throttled to ~24 inputs/s).
    osha_embed:
      name: sentinelops-osha-embed
      max_concurrent_runs: 1
      timeout_seconds: 1800
      performance_target: STANDARD
      tasks:
        - task_key: embed
          max_retries: 0
          disable_auto_optimization: true
          timeout_seconds: 1800
          spark_python_task:
            python_file: ../jobs/embed_osha.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --endpoint
              - databricks-qwen3-embedding-0-6b
              - --partitions
              - '16'
              - --job-run-id
              - '{{job.run_id}}'
              - --source-root
              - ${workspace.file_path}/src
          environment_key: embed
      environments:
        - environment_key: embed
          spec:
            environment_version: '4'
            dependencies:
              - numpy==2.5.3
    # Manual only. Scores exact retrieval (1,024 vs 256 dims) against TF-IDF on
    # OSHA-code relevance rules and logs results to MLflow.
    osha_retrieval_eval:
      name: sentinelops-osha-retrieval-eval
      max_concurrent_runs: 1
      timeout_seconds: 1200
      performance_target: STANDARD
      tasks:
        - task_key: evaluate
          max_retries: 0
          disable_auto_optimization: true
          timeout_seconds: 1200
          spark_python_task:
            python_file: ../jobs/evaluate_retrieval.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --endpoint
              - databricks-qwen3-embedding-0-6b
              - --k
              - '10'
              - --job-run-id
              - '{{job.run_id}}'
              - --source-root
              - ${workspace.file_path}/src
          environment_key: evaluate
      environments:
        - environment_key: evaluate
          spec:
            environment_version: '4'
            dependencies:
              - numpy==2.5.3
              - pandas==2.3.3
              - scikit-learn==1.9.1
              - mlflow==3.16.1
    # Manual only. Grounded answers with code-checked [report_id] citations and a calibrated
    # decline rule (GPT-OSS-120B over 256-dim exact retrieval), judged by Llama 3.3 70B on
    # held-out questions (eval_v3_identity; eval_v2 reruns as a regression set). One MLflow trace per
    # question; pay-per-token endpoints only.
    osha_answer_eval:
      name: sentinelops-osha-answer-eval
      max_concurrent_runs: 1
      timeout_seconds: 2700
      performance_target: STANDARD
      # Which question sets to run (comma-separated sentinelops.answer_eval.SETS names); override
      # per run, e.g. eval_v3_identity alone for a masking regression.
      parameters:
        - name: question_sets
          default: eval_v3_identity,eval_v2
      tasks:
        - task_key: evaluate
          max_retries: 0
          disable_auto_optimization: true
          timeout_seconds: 2700
          spark_python_task:
            python_file: ../jobs/evaluate_answers.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --embedding-endpoint
              - databricks-qwen3-embedding-0-6b
              - --chat-endpoint
              - databricks-gpt-oss-120b
              - --judge-endpoint
              - databricks-meta-llama-3-3-70b-instruct
              - --dimensions
              - '256'
              - --k
              - '8'
              - --max-tokens
              - '2048'
              - --reasoning-effort
              - low
              - --workers
              - '2'
              - --question-sets
              - '{{job.parameters.question_sets}}'
              - --job-run-id
              - '{{job.run_id}}'
              - --source-root
              - ${workspace.file_path}/src
          environment_key: answers
      environments:
        - environment_key: answers
          spec:
            environment_version: '4'
            dependencies:
              - numpy==2.5.3
              - pandas==2.3.3
              - mlflow==3.16.1
              - databricks-sdk==0.140.0
    # Manual only. Codes held-out OSHA narratives (event, nature, body part, source) with
    # ai_query + a JSON schema for each model, stores raw outputs once in gold.osha_extractions,
    # and scores them against OSHA's codes, a majority baseline and a supervised baseline.
    osha_extraction_eval:
      name: sentinelops-osha-extraction-eval
      max_concurrent_runs: 1
      timeout_seconds: 3600
      performance_target: STANDARD
      tasks:
        - task_key: evaluate
          max_retries: 0
          disable_auto_optimization: true
          timeout_seconds: 3600
          spark_python_task:
            python_file: ../jobs/evaluate_extraction.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --models
              - databricks-gpt-oss-120b,databricks-gpt-oss-20b
              - --reasoning-effort
              - medium
              - --max-tokens
              - '2048'
              - --partitions
              - '4'
              - --job-run-id
              - '{{job.run_id}}'
              - --source-root
              - ${workspace.file_path}/src
          environment_key: extraction
      environments:
        - environment_key: extraction
          spec:
            environment_version: '4'
            dependencies:
              - numpy==2.5.3
              - pandas==2.3.3
              - scikit-learn==1.9.1
              - mlflow==3.16.1
